name = "studio-jl-beautyco"
main = "src/index.js"
compatibility_date = "2026-11-25"
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/admin", "/admin/*"]

[[d1_databases]]
binding = "DB"
database_name = "studio-jl-agenda"
database_id = "00000000-0000-4000-8000-000000000001"

[triggers]
crons = ["17 6 * * *"]
